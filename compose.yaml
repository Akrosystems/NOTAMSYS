name: notamsys

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notamsys
      POSTGRES_USER: notamsys
      POSTGRES_PASSWORD: notamsys
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notamsys -d notamsys"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: notamsys
      MINIO_ROOT_PASSWORD: notamsys-development
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      NOTAMSYS_DATABASE_URL: postgresql+asyncpg://notamsys:notamsys@postgres:5432/notamsys
      NOTAMSYS_REDIS_URL: redis://redis:6379/0
      NOTAMSYS_OBJECT_STORAGE_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      NOTAMSYS_DATABASE_URL: postgresql+asyncpg://notamsys:notamsys@postgres:5432/notamsys
      NOTAMSYS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A app.worker.celery worker --loglevel=INFO

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      INTERNAL_API_URL: http://api:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  minio_data:
