[project]
name = "notamsys-api"
version = "0.1.0"
description = "Safety-oriented NOTAM workflow and publication API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  # AIXM 5.1.1 Event XML generation runs unconditionally on every draft
  # save (services/workflow.py:create_draft) -- not actually optional
  # despite the Phase 4 plan originally scoping it that way.
  "lxml>=5.3,<6",
  "minio>=7.2,<8",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pyproj>=3.6,<4",
  "python-multipart>=0.0.20,<1",
  "shapely>=2.0,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]
# Optional: local OCR/NLP extraction pipeline. Genuinely optional -- these
# are lazily imported inside the functions that use them (see
# services/extraction/ingest.py, ocr.py), so the app runs and NOTAMSYS_
# EXTRACTION_ENABLED=false works fine without this group installed. Actual
# scanned-image OCR (as opposed to PDF text-layer extraction, which only
# needs pymupdf) also requires the tesseract binary itself on the host --
# not a Python package, must be provisioned separately.
ocr = [
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3,<1",
  "pillow>=10.4,<11"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
  "ASYNC240", # Startup directory creation happens before request concurrency.
  "B008",     # FastAPI intentionally declares Depends/File/Query in signatures.
  "E501",     # Ruff formatter does not split all declarative API/model expressions.
  "UP042"     # SQLAlchemy/Pydantic enum interoperability uses str + Enum.
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
