# Render Blueprint -- provisions the API and web app; Postgres is external
# (Neon), not Render-managed, since a Render free account only allows one
# active free-tier database and this one was already spoken for elsewhere
# on the connected account. See docs/DEPLOYMENT.md for the one-time
# manual setup this still needs (connecting the repo, filling in the
# database URL and the two cross-service URLs, wiring the CI-gated
# deploy hooks).
#
# Deliberately NOT included: a Celery worker or Redis service. Nothing in
# this codebase currently dispatches a Celery task -- app/worker.py's
# tasks exist but every call site invokes the same underlying function
# inline instead (see the docstrings there). Deploying an idle worker
# with nothing feeding it would just be paying for infrastructure that
# does nothing, which is exactly the kind of unearned claim this project
# tries not to make elsewhere. Add both back here if that changes.
#
# Also deliberately NOT included: a persistent disk on notamsys-api.
# Render's free plan doesn't support disks at all -- attaching one here
# would make the Blueprint fail to validate on the tier this defaults to.
# Without one, NOTAMSYS_STORAGE_BACKEND=local means uploaded evidence
# files are lost on every restart/redeploy (Render's container filesystem
# is otherwise ephemeral). Upgrade notamsys-api's plan to Starter or above
# and add a disk block back (see docs/DEPLOYMENT.md) once evidence needs
# to survive a redeploy, or switch NOTAMSYS_STORAGE_BACKEND to "minio"
# against a real S3-compatible bucket instead.
services:
  - type: web
    name: notamsys-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    # No dockerCommand override -- Render doesn't run it through a shell, so
    # the "&&" between alembic and uvicorn was being treated as literal text
    # instead of a shell operator (confirmed live: "not found" exit 127).
    # The Dockerfile's own CMD (shell form) does this correctly instead.
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NOTAMSYS_ENVIRONMENT
        value: production
      - key: NOTAMSYS_SECRET_KEY
        generateValue: true
      # External Postgres (Neon or otherwise) -- paste the full connection
      # string in the Render dashboard's Environment tab, never here (this
      # file is committed to a public repo). Use the "postgresql://" or
      # "postgres://" form Neon/Supabase give you as-is; Settings rewrites
      # the dialect and any sslmode/channel_binding query params asyncpg
      # doesn't understand at startup (apps/api/app/core/config.py).
      - key: NOTAMSYS_DATABASE_URL
        sync: false
      # Filled in by hand after the web service below exists and you know
      # its actual .onrender.com URL -- see docs/DEPLOYMENT.md. Predicting
      # it here isn't safe: the name in this file is only the *requested*
      # Render subdomain, and Render silently suffixes it if that name is
      # already taken by someone else's service.
      - key: NOTAMSYS_CORS_ORIGINS
        sync: false
      - key: NOTAMSYS_STORAGE_BACKEND
        value: local
      - key: NOTAMSYS_OCR_ENGINE
        value: disabled
      - key: NOTAMSYS_EXTRACTION_ENABLED
        value: "false"
      - key: NOTAMSYS_PUBLICATION_MODE
        value: simulated_sync
      - key: NOTAMSYS_PUBLIC_INTAKE_ENABLED
        value: "true"
      - key: NOTAMSYS_AIP_PROVIDER
        value: seed

  - type: web
    name: notamsys-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: false
    envVars:
      # Same reasoning as NOTAMSYS_CORS_ORIGINS above -- fill in with the
      # notamsys-api service's actual URL + /api/v1 once it exists.
      - key: INTERNAL_API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
