name: Keep Render services awake

# Render's free plan spins a service down after 15 minutes with no
# incoming requests. This is not something render.yaml can configure --
# it's how the free tier works, and the only thing that actually
# eliminates it is a paid plan. This workflow is the unofficial
# workaround: ping both services often enough that the idle timer never
# reaches 15 minutes. It does NOT fix Neon's separate free-tier database
# auto-suspend (the first query after Neon suspends its compute is
# slower while it wakes back up -- see docs/DEPLOYMENT.md), and GitHub's
# scheduled-workflow cron can slip by several minutes under load, so
# this reduces cold starts, it doesn't guarantee zero.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping notamsys-api
        run: 'curl -sf -o /dev/null -w "api: %{http_code}\n" https://notamsys-api.onrender.com/health || true'
      - name: Ping notamsys-web
        run: 'curl -sf -o /dev/null -w "web: %{http_code}\n" https://notamsys-web.onrender.com/ || true'
