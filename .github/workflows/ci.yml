name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @notamsys/web lint
      - run: pnpm --filter @notamsys/web test
      - run: pnpm --filter @notamsys/web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # ocr extras (pymupdf/pytesseract/pillow) are genuinely optional at
      # runtime -- lazily imported, gated by NOTAMSYS_EXTRACTION_ENABLED --
      # but test_extraction_pipeline.py/test_extraction_api.py exercise the
      # real PDF text-layer path (via NullOcr, no tesseract binary needed)
      # and need pymupdf importable to do that meaningfully.
      - run: pip install -e ".[dev,ocr]"
        working-directory: apps/api
      - run: ruff check .
        working-directory: apps/api
      - run: pytest --cov=app
        working-directory: apps/api
